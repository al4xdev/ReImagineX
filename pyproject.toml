[project]
name = "reimaginex"
version = "1.3.0"
description = "Image-to-image generation gallery with ComfyUI backend and LLM prompt expansion"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.137",
    "uvicorn>=0.49",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pillow>=11",
    "python-multipart>=0.0.22",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
